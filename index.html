<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Journey" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Journey Planner</title>
    <script>
      // tema scelto dall'utente (o quello del telefono), applicato prima del primo disegno: niente lampo
      try {
        var p = localStorage.getItem('jp.theme.v1');
        var d = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.dataset.theme = d ? 'dark' : 'light';
        r.style.colorScheme = d ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#10172B' : '#FAF6EE');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
