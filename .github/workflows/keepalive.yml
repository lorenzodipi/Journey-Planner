name: Supabase keep-alive

# Il piano Free mette in pausa il progetto dopo 7 giorni di inattività.
# Questa lettura sul database, ogni 3 giorni, lo tiene sveglio.
# Attenzione: GitHub disattiva i workflow programmati dopo 60 giorni senza attività
# nel repo pubblico. Per questo c'è anche un ping esterno (vedi README).

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Legge la tabella health
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Variabili VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY non impostate"; exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/health?select=ok&limit=1"
          echo
