name: App Android (APK)

# Costruisce l'APK firmato e lo pubblica nella release "android-latest".
# Parte da solo a ogni commit sui branch main e redesign/faraway-azzurro; si può anche lanciare a mano: Actions > "App Android (APK)" > Run workflow.
# Prima volta: servono i 4 Secrets del keystore (vedi docs/APP_NATIVA.md).

on:
  push:
    branches: [main, redesign/faraway-azzurro]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build web (modalità nativa)
        run: npm run build:native
        env:
          # Valori pubblici per progettazione (Settings > Secrets and variables > Actions > Variables)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Controlla che le variabili ci siano
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (Variables del repo): l'app partirebbe in modalità demo."; exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore dai Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante: vedi docs/APP_NATIVA.md"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Versione
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK firmato
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verifica la firma
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" JourneyPlanner.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: JourneyPlanner-apk
          path: JourneyPlanner.apk
          retention-days: 30

      - name: Pubblica nella release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest JourneyPlanner.apk \
            --target "$GITHUB_SHA" --latest=false \
            --title "Android $VERSION_NAME" \
            --notes "APK firmato · versione $VERSION_NAME (build #${{ github.run_number }}) · commit ${GITHUB_SHA::7}. Installa scaricando JourneyPlanner.apk dal telefono."
